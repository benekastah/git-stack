name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request, or to main, cancels the run on the older
# commit, which no one needs any more, so runs don't pile up in the account's
# few shared runners. (Each pull request passed CI before it merged.) A re-run
# doesn't cancel a run in progress: re-running an older commit's run waits for
# the newest's, unless that's still waiting to start, which it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  # Linting and type checking give the same answer everywhere (mypy checks for
  # Windows too, and for the oldest Python pyproject.toml allows), so they run
  # once.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          # The venv's Python (setup-python's), named so uv can't choose another.
          python-version: "3.11"
          # Makes .venv, where lint.sh looks for the tools.
          activate-environment: true
      - name: Install the dev dependencies
        run: uv sync --locked
      - name: Lint
        run: ./lint.sh

  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # About 20% more than the longest of these jobs took (1.7, 9.1 and 17
    # minutes on Linux, macOS and Windows), so one that hangs fails soon,
    # rather than after GitHub's default of 6 hours.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 21 || matrix.os == 'macos-latest' && 11 || 3 }}
    env:
      # pytest -n auto's workers, which would be one per CPU (3 or 4 on these
      # runners). The tests spend most of their time waiting for the git
      # processes they start, and the files they write, so more keep the CPUs
      # busy.
      PYTEST_XDIST_AUTO_NUM_WORKERS: 8
    strategy:
      fail-fast: false
      # Every Python pyproject.toml allows on Linux, and only the oldest and
      # newest on macOS and Windows, whose runners are slower and fewer.
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python: "3.11"}
          - {os: macos-latest, python: "3.15"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.15"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tests write many small files, in git repositories they make: on
      # Windows, onto a Dev Drive.
      - uses: ./.github/actions/fast-temp
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Spotlight indexes the files the tests write as they're written.
      - name: Stop Spotlight indexing files
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install the dev dependencies
        run: uv sync --locked
      - name: Run the tests
        run: python -m pytest

  # The one check the ruleset on main requires, so changing the jobs doesn't
  # change what's required. It runs even if a check failed (a skipped required
  # check would count as passing), and fails unless every check passed.
  passed:
    name: CI passed
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    # It takes seconds, or a minute when its first step waits for a
    # force-cancel.
    timeout-minutes: 2
    permissions:
      actions: write
      checks: read
    steps:
      # A cancelled run still runs this job, because of always(), and if it
      # was cancelled before this job started, cancelled() is false here, but
      # a check's result is 'cancelled'. Cancelling this job too, which only
      # force-cancel can, marks it cancelled rather than failed, which blocks
      # a merge just the same. (A fork's pull request can't, so there it
      # fails.) A check that ran out of time is cancelled too, but that's a
      # failure, which GitHub says only in the check's annotations. If the
      # force-cancel hasn't stopped this job within a minute, it fails. A run
      # in which a check failed ends red, since the commit really failed.
      - name: Cancel this job if the run was cancelled
        if: (cancelled() || contains(needs.*.result, 'cancelled')) && !contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            -q '.jobs[] | select(.conclusion == "cancelled") | .id')
          for job in $jobs; do
            messages=$(gh api --paginate "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" -q '.[].message')
            if grep -q 'exceeded the maximum execution time' <<<"$messages"; then
              echo "A check ran out of time."
              exit 1
            fi
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/force-cancel"
          sleep 60
          exit 1
      # always(): without it, this step doesn't run in a cancelled run, so one
      # in which a check failed could end green.
      - name: Fail unless every check passed
        if: always() && (needs.lint.result != 'success' || needs.test.result != 'success')
        run: exit 1
