name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # git-stack doesn't run on Windows yet (see "No Windows support" in
    # ISSUES.md), so its jobs show how far off it is without failing the run.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Python pyproject.toml allows, and the newest.
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run every check
        if: runner.os != 'Windows'
        run: ./check.sh
      # check.sh and dev-venv.sh need a POSIX shell and a .venv/bin, so on
      # Windows, install the dev dependencies and run the tests directly.
      - name: Run the tests
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m pytest

  # The one check the ruleset on main requires, so changing the matrix doesn't
  # change what's required. It runs even if a check failed (a skipped required
  # check would count as passing), and fails unless every check but the Windows
  # ones (which may fail) passed.
  passed:
    name: CI passed
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check passed
        if: needs.check.result != 'success'
        run: exit 1
