# Times what the tests spend their time on, on each CI system, and the tests
# themselves, in the default temporary directory and then in a fast one (see
# .github/actions/fast-temp), to see where macOS and Windows are slower than
# Linux. It's for reading, not checking: it runs when it changes, or by hand.
name: Measure

on:
  pull_request:
    paths:
      - .github/workflows/measure.yml
      - .github/actions/fast-temp/**
      - tests/measure_costs.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install the dev dependencies
        run: python -m pip install --group dev
      - name: Time single operations, in the default temporary directory
        run: python -m tests.measure_costs
      - name: Run the tests, in the default temporary directory
        run: python -m pytest -q -p no:cacheprovider
      - uses: ./.github/actions/fast-temp
      - name: Time single operations, in the fast temporary directory
        run: python -m tests.measure_costs
      - name: Run the tests, in the fast temporary directory
        run: python -m pytest -q -p no:cacheprovider
