# Throwaway (don't merge): on Windows, with Defender off as in CI, times single operations and
# the whole suite in the default temporary directory and on a Dev Drive (.github/actions/
# fast-temp). Each runs three times: twice in the default directory, then on the Dev Drive. The
# first run warms what any run warms (Python's .pyc files, the OS's file cache), so the second
# and third are both warm and differ only in the directory. Two jobs, on two runners.
name: Measure

on:
  pull_request:
    paths:
      - .github/workflows/measure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: windows-latest, run ${{ matrix.run }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop Windows Defender scanning files as they're written
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install the dev dependencies
        run: python -m pip install --group dev
      - name: Remember the default temporary directory
        run: echo "DEFAULT_TMP=$(python -c 'import tempfile; print(tempfile.gettempdir())')" >> "$GITHUB_ENV"
      - uses: ./.github/actions/fast-temp
      - name: Single operations, default (to warm up), default, Dev Drive
        run: |
          for where in warm-up default devdrive; do
            if [ "$where" = devdrive ]; then dir='R:\temp'; else dir="$DEFAULT_TMP"; fi
            echo "### Operations: $where" >> "$GITHUB_STEP_SUMMARY"
            TMPDIR="$dir" TEMP="$dir" TMP="$dir" python -m tests.measure_costs "$dir"
          done
      - name: The tests, default (to warm up), default, Dev Drive
        run: |
          for where in warm-up default devdrive; do
            if [ "$where" = devdrive ]; then dir='R:\temp'; else dir="$DEFAULT_TMP"; fi
            rm -rf "$dir/pytest"
            started=$SECONDS
            TMPDIR="$dir" TEMP="$dir" TMP="$dir" python -m pytest -q -p no:cacheprovider --basetemp="$dir/pytest"
            echo "Tests, $where: $((SECONDS - started))s" | tee -a "$GITHUB_STEP_SUMMARY"
          done
