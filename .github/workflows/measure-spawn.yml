# Throwaway (don't merge): times each way of starting git on each system, from
# a small Python process and a large one. Results are in each job's summary.
name: Measure starting git

on:
  pull_request:
    paths:
      - .github/workflows/measure-spawn.yml
      - .github/measure-spawn/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # As CI does.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - name: Measure, twice
        shell: bash
        run: |
          for i in 1 2; do
            python -I .github/measure-spawn/measure.py | tee -a "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
