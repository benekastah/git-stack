# Weekly pull requests for new versions of the Python packages in uv.lock (the package's and
# the dev groups') and of the actions the workflows and .github/actions use. A version waits a week after its
# release before it's proposed, so one that's pulled or found to be malicious soon after is
# skipped.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    # The workflows, and the setup action they use.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
