name: Fast temporary directory
description: >-
  Point the temporary directory, where the tests make their git repositories,
  at storage that's quick to write many small files to: a tmpfs on Linux, a RAM
  disk on macOS, and a Dev Drive on Windows. Later steps get it as TMPDIR (and
  TEMP and TMP on Windows).
runs:
  using: composite
  steps:
    - name: Mount a tmpfs
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo mkdir -p /mnt/fast-temp
        sudo mount -t tmpfs -o size=2g,mode=1777 tmpfs /mnt/fast-temp
        echo "TMPDIR=/mnt/fast-temp" >> "$GITHUB_ENV"
    - name: Make a RAM disk
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # 2 GiB, in 512-byte sectors.
        device=$(hdiutil attach -nomount ram://4194304 | tr -d '[:space:]')
        diskutil erasevolume APFS FastTemp "$device"
        echo "TMPDIR=/Volumes/FastTemp" >> "$GITHUB_ENV"
    - name: Make a Dev Drive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # A Dev Drive is ReFS, which Defender scans asynchronously once it's
        # trusted, instead of before each file is written.
        $vhd = "$env:RUNNER_TEMP\fast-temp.vhdx"
        $script = "$env:RUNNER_TEMP\fast-temp.diskpart"
        @(
          "create vdisk file=`"$vhd`" maximum=4096 type=expandable",
          "attach vdisk",
          "convert gpt",
          "create partition primary",
          "assign letter=R"
        ) | Set-Content -Path $script
        diskpart /s $script
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Format-Volume -DriveLetter R -DevDrive -Confirm:$false -Force
        fsutil devdrv trust R:
        New-Item -ItemType Directory -Path R:\temp | Out-Null
        foreach ($name in "TMPDIR", "TEMP", "TMP") { "$name=R:\temp" >> $env:GITHUB_ENV }
