[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "git-stack"
version = "0.1.0"
description = "Stacked branches that survive squash merges"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
git-stack = "git_stack.cli:main"

[tool.setuptools.packages.find]
include = ["git_stack*"]
