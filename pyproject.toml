[project]
name = "git-stack"
dynamic = ["version"]
description = "Stacked branches that survive squash merges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Harper", email = "benekastah@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    # v0.0.2, by its commit: a tag can move, and pip, pipx and `uv tool install` don't read uv.lock.
    "py-git-client @ git+https://github.com/benekastah/py-git-client@a1b4b0f15ae740c17db2d5fca4684aeaae6a8d54",
]

[project.scripts]
git-stack = "git_stack.cli:main"

[dependency-groups]
# The template's dev tools, kept current by `copier update`; the project's own go in `dev`
# (`uv add --dev`), so the two never conflict.
template-dev = [
    "basedpyright>=1.40.2",
    "coverage>=7.17.3",
    # pandoc, for dev.py man. Pinned: `man --check` compares its exact output with the pages.
    # It has no wheel for Windows on ARM, so dev.py venv fails there.
    "pypandoc_binary==1.17",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]
# distlib makes the tests' commands on Windows (tests/helpers.py's install_command).
dev = [{ include-group = "template-dev" }, "distlib>=0.4.4"]

# setuptools rather than the template's hatchling, for data-files: a wheel installs the man page.
[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "git_stack._version.__version__"}

[tool.setuptools.packages.find]
include = ["git_stack*"]

[tool.setuptools.package-data]
git_stack = ["skills/*/*.md"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/git-stack.1"]

[tool.pytest]
testpaths = ["tests"]
# One worker per CPU (pytest-xdist); `-n 0` runs them one at a time, e.g. to debug.
addopts = ["--numprocesses", "auto"]

[tool.ruff]
line-length = 120
target-version = "py315"
# dev.py runs under an older Python too, to say it's too old: keep it to syntax that parses there.
per-file-target-version = { "dev.py" = "py311" }
# Leave out dev.py even when named, as the pre-commit hook names files.
force-exclude = true

[tool.ruff.format]
# dev.py is the template's, formatted at its line length (100); `copier update` replaces it.
exclude = ["dev.py"]

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    # The project's own below:
    # ANN: every function's parameters and return annotated (a return isn't inferred), but Any
    # allowed.
    "ANN",
    "C901",
    "PERF401",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# dev.py is the template's: hold it only to the template's rules.
"dev.py" = ["ANN", "C901", "PERF401"]

[tool.basedpyright]
include = [
    "git_stack",  # the template's "src": git-stack's package is at the root
    "tests",
    "dev.py",
    # The project's own below:
    "dev_project.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.15"
# One system at a time, so a call another system lacks (e.g. fcntl's on Windows) is reported:
# `dev.py types-other-platforms` runs it as if on Windows and macOS too.
pythonPlatform = "Linux"
# Off, until about 95 places, mostly JSON read from GitHub, get types: these let a value of
# unknown type (e.g. from json.loads) be passed, called or read from unchecked.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false

[tool.coverage.run]
source = ["git_stack"]
branch = true
# Measure each pytest-xdist worker, a process of its own, in a data file of its own, which
# `dev.py coverage` combines.
parallel = true
patch = ["subprocess"]
# pytest-xdist's main process runs no tests, so it measures nothing: not worth a warning.
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
show_missing = true
skip_covered = true
