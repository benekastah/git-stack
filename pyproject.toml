[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "git-stack"
version = "0.1.0"
description = "Stacked branches that survive squash merges"
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
# pypandoc_binary is pinned because man/build.py --check (and so the tests) compares
# its pandoc's exact output with the committed man/git-stack.1.
dev = ["mypy>=2.4.0", "pypandoc_binary==1.17", "pytest>=9.1.1"]

[project.scripts]
git-stack = "git_stack.cli:main"

[tool.setuptools.packages.find]
include = ["git_stack*"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/git-stack.1"]

[tool.pytest]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["git_stack", "tests", "man/build.py"]
