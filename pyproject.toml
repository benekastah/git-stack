[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "git-stack"
version = "0.1.0"
description = "Stacked branches that survive squash merges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[dependency-groups]
# pypandoc_binary is pinned because man/build.py --check (and so the tests) compares
# its pandoc's exact output with the committed man/git-stack.1. distlib makes the
# tests' commands on Windows (tests/helpers.py's install_command).
dev = ["basedpyright>=1.40.2", "distlib>=0.4.4", "pypandoc_binary==1.17", "pytest>=9.1.1", "pytest-xdist>=3.8.0", "ruff>=0.17.1", "shellcheck-py>=0.11.0.1"]

[project.scripts]
git-stack = "git_stack.cli:main"

[tool.setuptools.packages.find]
include = ["git_stack*"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/git-stack.1"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-n", "auto"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["B904", "B905", "C901", "PERF401"]

[tool.basedpyright]
include = ["git_stack", "tests", "man/build.py"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# Every system's code: what's under `sys.platform == "win32"` (e.g. in file_lock.py) and what
# isn't are both checked, wherever this runs.
pythonPlatform = "All"
# Strict's rules about values of unknown type are off: about 170 places, mostly JSON read from
# GitHub, would need types first.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
